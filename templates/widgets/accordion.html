<!-- jQueryUI Accordion -->
<script type="text/javascript" src="assets/widgets/accordion-ui/accordion.js"></script>
<script type="text/javascript">
$(function() { 
  "use strict";
  $(".accordion").accordion({
    heightStyle: "content"
  });
});

$(function() { 
  "use strict";
  $("#accordion-hover").accordion({
    event: 'mouseover',
    heightStyle: 'auto'
  });
});
</script>
